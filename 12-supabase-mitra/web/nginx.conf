server {
  listen 80;
  root /srv/web;
  index index.html;
  # Peramban berbicara langsung ke Supabase (gateway API di :18121); nginx hanya menyajikan berkas statis.
  location /shared/ { alias /srv/shared/; }
  location = /nginx.conf { return 404; }
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' http://127.0.0.1:18121 ws://127.0.0.1:18121 https://*.supabase.co wss://*.supabase.co; img-src 'self' data:" always;
}
