name: konsep-12

# Portal Mitra Servis. Supabase lokal (Postgres, Auth, PostgREST, Realtime, gateway Kong) dijalankan oleh
# Supabase CLI: `npx supabase@3.0.0 start ...` (lihat README). Compose ini hanya berisi dasbor dan simulator.
services:
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./web:/srv/web:ro
      - ../shared:/srv/shared:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:18120:80"]

  simulator:
    image: postgres:17-alpine           # cukup psql; logika simulator ada di supabase/migrations/*_simulator.sql
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DB_URL: ${SIM_DB_URL:-postgresql://postgres:postgres@host.docker.internal:18122/postgres}
      TICK_DETIK: ${TICK_DETIK:-45}
    command: >
      sh -c "until psql $$DB_URL -qtc 'select 1' >/dev/null 2>&1; do echo menunggu Supabase; sleep 3; done;
             while true; do psql $$DB_URL -qtc 'select sim.tick()' >/dev/null; sleep $${TICK_DETIK}; done"
