# Broker MQTT gudang. TCP untuk simulator dan bridge, WebSocket untuk dasbor di browser.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Klien anonim (browser, bridge) hanya boleh membaca; hanya pengguna simulator yang boleh menulis.
allow_anonymous true
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
