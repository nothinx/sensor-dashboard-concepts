# Prometheus = basis data deret waktu proyek 07. Retensi diatur lewat flag di docker-compose.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: noc-exporter
    static_configs:
      - targets: ["exporter:9100"]
