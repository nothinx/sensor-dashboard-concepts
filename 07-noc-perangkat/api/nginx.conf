# Satu origin untuk dasbor + proxy baca-saja ke HTTP API Prometheus, jadi tidak perlu CORS.
# Hanya endpoint yang dipakai dasbor yang dibuka; admin API Prometheus tidak bisa dijangkau dari sini.
server {
  listen 80;
  resolver 127.0.0.11 valid=30s;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location /shared/ {
    alias /srv/shared/;
  }

  location ~ ^/prom/api/v1/(query|query_range|alerts|rules)$ {
    limit_except GET { deny all; }
    proxy_pass http://prometheus:9090/api/v1/$1$is_args$args;
    proxy_read_timeout 15s;
  }

  location /prom/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
