server {
  listen 80;
  root /srv/web;
  index index.html;

  # Dasbor dan API satu origin (pengganti domain API Gateway), jadi CORS tidak diperlukan.
  location /api/ {
    limit_except GET HEAD { deny all; }   # API dasbor hanya baca
    proxy_pass http://api:3000/;
  }
  location /shared/ { alias /srv/shared/; }
  location = /nginx.conf { return 404; }
}
