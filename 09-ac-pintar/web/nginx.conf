server {
  listen 80;
  root /srv/web;
  index index.html;

  # Dasbor dan API satu origin, jadi CORS tidak diperlukan.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    # API hanya baca dari peramban
    limit_except GET HEAD POST { deny all; }
  }
  location /shared/ { alias /srv/shared/; }
  location = /nginx.conf { return 404; }
}
