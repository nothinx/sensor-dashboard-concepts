name: konsep-15

# Jejak Mutu: MongoDB Atlas lokal (mongod + mongot untuk Atlas Search) -> API Python -> dasbor
# Untuk klaster Atlas asli: TARGET=cloud dan isi MONGODB_URI_CLOUD di .env; layanan atlas tidak dipakai.
services:
  atlas:
    image: mongodb/mongodb-atlas-local:8.0.34
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_USER:?isi MONGO_USER di .env}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?isi MONGO_PASSWORD di .env}
    volumes:
      - data:/data/db
      - config:/data/configdb
    ports: ["127.0.0.1:18151:27017"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/runner", "healthcheck"]
      interval: 5s
      timeout: 30s
      start_period: 60s
      retries: 30

  api:
    build: .
    command: python api/app.py
    depends_on: { atlas: { condition: service_healthy } }
    environment: &env
      TARGET: ${TARGET:-emulator}
      MONGODB_URI_EMULATOR: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@atlas:27017/?directConnection=true&authSource=admin
      MONGODB_URI_CLOUD: ${MONGODB_URI_CLOUD:-}
      WEB_DIR: /srv/web
      SHARED_DIR: /srv/shared
    volumes:
      - ./web:/srv/web:ro
      - ../shared:/srv/shared:ro
    ports: ["127.0.0.1:18150:8000"]

  simulator:
    build: .
    command: python simulator/simulator.py
    depends_on: { atlas: { condition: service_healthy } }
    environment:
      <<: *env
      TICK_DETIK: ${TICK_DETIK:-6}

volumes:
  data:
  config:
